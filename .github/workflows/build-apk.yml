name: Build modified Moneybook APK

on:
  workflow_dispatch:
  push:
    branches: [networth]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same Flutter generation (Dart 3.6) as the installed Play Store build.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No KEYSTORE_BASE64 secret: using debug signing"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/personal.jks
          cat > android/key.properties <<PROPS
          storeFile=app/personal.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=moneybook
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - run: flutter pub get
      - run: flutter test test/features/accounts
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: moneybook-networth-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
