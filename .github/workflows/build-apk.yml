name: Build modified Moneybook APK

on:
  workflow_dispatch:
  push:
    branches: [networth]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same Flutter generation (Dart 3.6) as the installed Play Store build.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No KEYSTORE_BASE64 secret: using debug signing"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/personal.jks
          cat > android/key.properties <<PROPS
          storeFile=app/personal.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=moneybook
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - run: flutter pub get
      # Lists compile errors and warnings in a readable form. The APK build below fails anyway on real errors.
      - name: Analyze (errors only block the build step below)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test/features/accounts test/features/bookings/saldo_calculator_test.dart test/features/budgets test/features/goals test/shared test/helpers
        continue-on-error: true
      - name: Unit tests (net worth, saldo, budgets, goals, navigation)
        run: flutter test test/features/accounts test/features/bookings/saldo_calculator_test.dart test/features/budgets test/features/goals test/shared
        # A test problem should not stop the APK from being built; check this step's log.
        continue-on-error: true
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: moneybook-networth-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
